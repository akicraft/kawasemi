# プルリクエストごとに Biome・型チェック・スクリーンショット比較を回す
name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # pnpm の版は package.json の packageManager から読む
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # テーマの生成物（src/themes/）・AGENTS.md・Astryx の版と、dist/（themes/ と mcp/）が食い違っていないか。
      # 新しく増えたファイル（未追跡）も落とす
      - name: dist/ が最新か
        run: |
          pnpm build
          git diff --exit-code -- dist
          test -z "$(git status --porcelain -- dist)" || { git status --porcelain -- dist; exit 1; }

      - name: Biome
        run: pnpm check

      - name: 型チェック
        run: pnpm typecheck

      - name: Playwright のブラウザを入れる
        run: pnpm exec playwright install --with-deps chromium

      - name: スクリーンショット比較
        run: pnpm test

      - name: 差分の画像を残す
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

# プルリクエストごとに Biome・型チェック・スクリーンショット比較を回す
name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # pnpm の版は package.json の packageManager から読む
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # テーマの生成物（src/themes/）と dist/themes/ が食い違っていないか
      - name: dist/themes/ が最新か
        run: |
          pnpm build
          git diff --exit-code -- dist

      - name: Biome
        run: pnpm check

      - name: 型チェック
        run: pnpm typecheck

      - name: Playwright のブラウザを入れる
        run: pnpm exec playwright install --with-deps chromium

      - name: スクリーンショット比較
        run: pnpm test

      - name: 差分の画像を残す
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
